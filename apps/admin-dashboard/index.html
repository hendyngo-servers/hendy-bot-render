<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b43">
  <meta name="description" content="Hendy Bot - Trung tâm dịch vụ, ví điện tử và chăm sóc khách hàng">
  <title>Hendy Bot | Trung tâm dịch vụ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink:#101a3b; --muted:#75809d; --line:#e5eafe; --surface:#fff;
      --navy:#101b43; --blue:#1788f9; --violet:#8b42ec; --cyan:#24c5dc;
      --green:#16b978; --orange:#ff9b32; --pink:#ef5caa;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#eef3ff; color:var(--ink);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 0%,#dce8ff 0,#eef3ff 42%,#f7f8ff 100%);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .shell{max-width:1100px;margin:0 auto;padding:16px 16px 28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(140deg,#22c7ed,#2469e8 55%,#873cf0);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;box-shadow:0 8px 18px #397be74d}
    .brand b{display:block;font-size:16px;letter-spacing:-.3px}
    .brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{border:1px solid #dce5ff;background:#fff;border-radius:13px;min-width:42px;height:42px;color:#52618a;font-size:19px;box-shadow:0 5px 14px #263b7510}
    .profile-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:5px 10px 5px 5px;font-size:12px;font-weight:750;max-width:145px}
    .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#27c2e9,#4e62df);display:grid;place-items:center;color:white;font-weight:800;flex:none}
    #page-title{font-size:21px;font-weight:900;letter-spacing:-.65px;margin:18px 0 5px}
    #page-subtitle{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.5}
    .hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(125deg,#172b62,#1556b5 55%,#853ee4);color:#fff;padding:21px 20px;box-shadow:0 15px 32px #315ab633;margin-bottom:16px}
    .hero:after{content:"✦";position:absolute;right:20px;top:2px;font-size:90px;opacity:.13}
    .hero .eyebrow{font-size:11px;opacity:.8;font-weight:800;letter-spacing:1px;text-transform:uppercase}
    .hero h2{font-size:24px;line-height:1.1;margin:7px 0 8px;max-width:75%;letter-spacing:-.7px}
    .hero p{font-size:12px;line-height:1.5;opacity:.85;margin:0;max-width:78%}
    .balance-card{background:#fff;border:1px solid #e0e8ff;border-radius:20px;padding:16px;margin:14px 0 17px;box-shadow:0 9px 24px #334c8c0d}
    .balance-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .balance-label{color:var(--muted);font-size:11px;font-weight:750}
    .balance-value{font-size:24px;font-weight:900;letter-spacing:-.6px;margin-top:4px}
    .vip-pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:7px 10px;background:linear-gradient(120deg,#fff3bc,#ffda66);color:#885600;font-size:11px;font-weight:900}
    .primary,.secondary,.danger,.tiny-btn{border:0;border-radius:13px;padding:11px 14px;font-weight:850;font-size:12px}
    .primary{color:white;background:linear-gradient(110deg,#148cf8,#514ef3 70%,#8c40ed);box-shadow:0 7px 14px #5268ef30}
    .secondary{color:#3159bd;background:#edf3ff;border:1px solid #dce6ff}
    .danger{color:#c53e51;background:#fff0f3;border:1px solid #ffd9e0}
    .tiny-btn{padding:7px 10px;border-radius:10px;background:#eaf1ff;color:#2457c1}
    .service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .service-tile{min-height:105px;border:0;border-radius:19px;padding:15px;text-align:left;color:white;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 9px 19px #223e791a}
    .service-tile .emoji{font-size:25px}
    .service-tile b{font-size:14px;line-height:1.2}
    .service-tile small{font-size:10px;opacity:.84;margin-top:4px}
    .g-blue{background:linear-gradient(130deg,#138af9,#3456e8)}
    .g-violet{background:linear-gradient(130deg,#a347f5,#642cce)}
    .g-green{background:linear-gradient(130deg,#18c78b,#0a9f79)}
    .g-orange{background:linear-gradient(130deg,#ffb34d,#ed7628)}
    .g-pink{background:linear-gradient(130deg,#fb73b4,#de3d87)}
    .g-cyan{background:linear-gradient(130deg,#32cde4,#1688c8)}
    .g-gold{background:linear-gradient(130deg,#ffce52,#e99519)}
    .g-navy{background:linear-gradient(130deg,#354c91,#16295f)}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 1px 11px}
    .section-head h3{font-size:15px;margin:0;font-weight:900}
    .section-head span{font-size:11px;color:var(--muted)}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 6px 18px #263d7809}
    .card-row{display:flex;gap:12px;align-items:center}
    .product-icon{width:54px;height:54px;border-radius:16px;background:linear-gradient(140deg,#e8f3ff,#e9e4ff);display:grid;place-items:center;font-size:25px;flex:none;overflow:hidden}
    .product-icon img{width:100%;height:100%;object-fit:cover}
    .product-copy{min-width:0;flex:1}
    .product-copy b{display:block;font-size:13px;margin-bottom:4px}
    .product-copy p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}
    .price{color:#245bce;font-size:13px;font-weight:900;white-space:nowrap}
    .muted{color:var(--muted)}
    .small{font-size:11px}
    .empty{background:#fff;border:1px dashed #cbd8f6;border-radius:18px;padding:24px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
    .empty b{display:block;color:#394b79;margin-bottom:5px;font-size:14px}
    .tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{white-space:nowrap;border:1px solid #dfe7fb;border-radius:30px;padding:8px 13px;background:#fff;color:#657292;font-size:11px;font-weight:800}
    .tab.active{background:#245dce;color:#fff;border-color:#245dce;box-shadow:0 5px 12px #245dce30}
    .form{display:grid;gap:10px}
    .field{display:grid;gap:5px}
    .field label{font-size:11px;font-weight:800;color:#4e5c7d}
    .field input,.field select,.field textarea{width:100%;border:1px solid #dce5f7;border-radius:12px;background:#f9fbff;padding:11px 12px;outline:none;color:#1c2a52;font-size:12px}
    .field textarea{min-height:90px;resize:vertical}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:#6f91ee;box-shadow:0 0 0 3px #3a73ed18}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .notice{border-radius:13px;padding:12px;background:#edf5ff;color:#2c5aa2;font-size:11px;line-height:1.5;margin-bottom:12px}
    .notice.warn{background:#fff7e8;color:#93621b}
    .notice.good{background:#e8fbf2;color:#18734f}
    .stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .stat{border:1px solid var(--line);background:white;border-radius:16px;padding:13px}
    .stat small{display:block;color:var(--muted);font-size:10px}
    .stat b{display:block;font-size:19px;margin-top:6px;letter-spacing:-.4px}
    .list-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #edf1fa}
    .list-row:last-child{border-bottom:0}
    .list-row b{font-size:12px;display:block}
    .list-row small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
    .status{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:850;background:#eef2fb;color:#66718e;white-space:nowrap}
    .status.pending{background:#fff4d9;color:#9a6814}
    .status.processing{background:#eaf1ff;color:#315fbe}
    .status.completed,.status.resolved{background:#e5f9ee;color:#168050}
    .status.rejected,.status.cancelled,.status.closed{background:#ffecef;color:#b94259}
    .qr-wrap{text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
    .qr-wrap img{width:min(260px,100%);border-radius:12px}
    .code-box{background:#eff4ff;border:1px dashed #9cb7f0;border-radius:13px;padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;color:#1d52ba}
    .admin-tabs{display:flex;gap:7px;overflow:auto;margin:0 -2px 12px;padding:2px 2px 9px}
    .admin-tab{flex:none;border:1px solid #dce5fa;background:#fff;color:#5e6b8d;border-radius:11px;padding:9px 11px;font-size:11px;font-weight:850}
    .admin-tab.active{background:#17295b;color:#fff;border-color:#17295b}
    .record{border:1px solid #e6ebf7;border-radius:14px;padding:12px;margin-bottom:9px;background:#fff}
    .record-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .record b{font-size:12px}
    .record p{font-size:11px;color:#677391;line-height:1.5;margin:7px 0}
    .bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid #dfe7fa;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
    .nav-inner{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
    .nav-btn{border:0;background:transparent;border-radius:13px;padding:5px 2px;color:#8190ad;font-size:9px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:3px}
    .nav-btn span{font-size:19px;line-height:1.1}
    .nav-btn.active{background:#eef3ff;color:#245bd0}
    .toast{position:fixed;z-index:70;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 15px;border-radius:13px;color:#fff;background:#152654;box-shadow:0 10px 30px #14214e40;font-size:12px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .toast.show{opacity:1}
    .loading{padding:35px 10px;text-align:center;color:#7784a3;font-size:12px}
    .hidden{display:none!important}
    @media(min-width:760px){
      .shell{padding:24px 24px 35px}
      .service-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .hero{padding:28px}
      .hero h2{font-size:30px}
      .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,calc(100% - 40px));border:1px solid #dfe7fa;border-radius:20px 20px 0 0}
    }
  </style>
  <link rel="stylesheet" href="/styles/buttons.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">H</div>
        <div><b id="brand-name">Hendy Bot</b><small>Trung tâm dịch vụ · Hỗ trợ 24/7</small></div>
      </div>
      <div class="top-actions">
        <div class="profile-chip" id="profile-chip"><span class="avatar">?</span><span id="profile-name">Đang tải</span></div>
        <button class="icon-btn" id="menu-button" aria-label="Mở menu">☰</button>
      </div>
    </header>
    <div id="page-title">Đang tải ứng dụng</div>
    <p id="page-subtitle">Đang xác thực phiên Telegram…</p>
    <main id="app"><div class="loading">Đang kết nối máy chủ…</div></main>
  </div>
  <nav class="bottom-nav" aria-label="Điều hướng chính">
    <div class="nav-inner" id="bottom-navigation">
      <button class="nav-btn active" data-page="home"><span>🏠</span>Trang chủ</button>
      <button class="nav-btn" data-page="orders"><span>🧾</span>Đơn hàng</button>
      <button class="nav-btn" data-page="customer"><span>💎</span>Khách hàng</button>
      <button class="nav-btn" data-page="support"><span>🎧</span>CSKH</button>
      <button class="nav-btn hidden" id="admin-nav" data-page="admin"><span>🛡️</span>Quản trị</button>
    </div>
  </nav>
  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : '';
  const state = { boot:null, page:'home', category:'minigame', adminTab:'overview', wallet:null, orders:[], tickets:[], adminData:{}, editingProductId:null };
  const $ = id => document.getElementById(id);
  const money = value => new Intl.NumberFormat('vi-VN').format(Number(value || 0)) + ' VNĐ';
  const escapeHtml = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const labels = {minigame:'Mini Game Live',tools:'App / Tool',codes:'Mua Code',otp:'OTP & Proxy',proxy:'Proxy',vip:'Thành viên VIP'};
  const icons = {minigame:'🎮',tools:'🗂️',codes:'🛍️',otp:'🛡️',proxy:'🌐',vip:'👑'};
  const pageTitles = {
    home:['Trang chủ','Chọn dịch vụ và quản lý tài khoản Hendy Bot.'],
    matchmaking:['Ghép đôi','Tìm người chơi phù hợp và tạo lượt ghép trực tiếp.'],
    minigame:['Mini Game Live','Danh sách trò chơi và gói tham gia đang mở.'],
    tools:['App / Tool','Quản lý danh sách công cụ và thời hạn thuê.'],
    codes:['Mua Code','Chọn mã bản quyền và theo dõi bàn giao.'],
    otp:['OTP & Proxy','Danh sách dịch vụ OTP và proxy đang được cung cấp.'],
    proxy:['Proxy','Danh sách gói proxy đang được cung cấp.'],
    vip:['Thành viên VIP','Theo dõi cấp thành viên và quyền lợi.'],
    wallet:['Ví điện tử','Nạp tiền và xem biến động số dư.'],
    orders:['Đơn hàng','Theo dõi trạng thái xử lý và thông tin bàn giao.'],
    customer:['Trung tâm khách hàng','Hồ sơ, lịch sử, giới thiệu và trợ giúp.'],
    support:['Chăm sóc khách hàng','Gửi yêu cầu và theo dõi phản hồi từ đội ngũ hỗ trợ.'],
    referrals:['Giới thiệu bạn bè','Chia sẻ liên kết và theo dõi người được giới thiệu.'],
    giftcode:['Giftcode','Nhập mã quà tặng để nhận thưởng vào ví.'],
    admin:['Bảng điều khiển Admin','Quản lý sản phẩm, đơn hàng, thành viên và cấu hình.']
  };

  async function api(path, method, body) {
    if (!initData) throw new Error('Hãy mở Mini App từ Telegram Bot để xác thực tài khoản.');
    const response = await fetch(path, {
      method:method || 'GET',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'tma ' + initData
      },
      body:body === undefined ? undefined : JSON.stringify(body),
      cache:'no-store'
    });
    let data = {};
    try { data = await response.json(); } catch (error) {}
    if (!response.ok) throw new Error(data.error || 'Không thể thực hiện yêu cầu.');
    return data;
  }

  function toast(message) {
    const node = $('toast');
    node.textContent = message;
    node.classList.add('show');
    window.clearTimeout(toast.timer);
    toast.timer = window.setTimeout(() => node.classList.remove('show'), 2600);
  }

  function header(title, subtitle) {
    $('page-title').textContent = title;
    $('page-subtitle').textContent = subtitle;
    document.querySelectorAll('.nav-btn').forEach(button => button.classList.toggle('active', button.dataset.page === state.page));
    if (state.boot && state.boot.isAdmin) $('admin-nav').classList.remove('hidden');
    else $('admin-nav').classList.add('hidden');
  }

  function empty(title, description, button) {
    return '<div class="empty"><b>' + escapeHtml(title) + '</b>' + escapeHtml(description || '') +
      (button || '') + '</div>';
  }

  function productCard(product) {
    const image = product.imageUrl
      ? '<img src="' + escapeHtml(product.imageUrl) + '" alt="">'
      : escapeHtml(icons[product.category] || '✨');
    const stock = product.stock === null ? 'Còn hàng' : (product.stock > 0 ? 'Còn ' + product.stock + ' sản phẩm' : 'Hết hàng');
    return '<article class="card"><div class="card-row"><div class="product-icon">' + image + '</div>' +
      '<div class="product-copy"><b>' + escapeHtml(product.name) + '</b><p>' + escapeHtml(product.description || labels[product.category] || '') +
      (product.durationDays ? '<br>Thời hạn: ' + product.durationDays + ' ngày' : '') +
      '<br><span class="muted">' + escapeHtml(stock) + '</span></p></div>' +
      '<div><div class="price">' + money(product.price) + '</div><button class="primary" data-buy="' + escapeHtml(product.id) + '" style="margin-top:9px;padding:8px 10px">Mua ngay</button></div></div></article>';
  }

  function renderHome() {
    const user = state.boot.user;
    const settings = state.boot.settings || {};
    const name = user.name || 'Thành viên';
    const services = [
      ['minigame','🎮','Mini Game Live','Chơi game · Nhận quà','g-violet'],
      ['tools','🗂️','App / Tool','Công cụ chuyên nghiệp','g-blue'],
      ['codes','🛍️','Mua Code','Mã bản quyền nhanh chóng','g-green'],
      ['wallet','👛','Ví điện tử','Nạp tiền · Lịch sử','g-orange'],
      ['otp','🛡️','OTP & Proxy','Dịch vụ bảo mật','g-cyan'],
      ['vip','👑','Thành viên VIP','Đặc quyền hội viên','g-gold'],
      ['matchmaking','🤝','Ghép đôi','Tìm đối thủ trực tuyến','g-cyan'],
      ['support','🎧','CSKH','Hỗ trợ và lịch sử','g-pink'],
      ['giftcode','🎁','Giftcode','Nhận quà tặng','g-violet'],
      ['referrals','👥','Giới thiệu REF','Chia sẻ nhận thưởng','g-blue']
    ];
    return '<section class="hero"><div class="eyebrow">HENDY BOT TELEGRAM</div><h2>Xin chào, ' + escapeHtml(name) + ' 👋</h2>' +
      '<p>' + escapeHtml(settings.announcement || 'Kết nối dịch vụ · Tiện ích · Hỗ trợ khách hàng') + '</p></section>' +
      '<section class="balance-card"><div class="balance-row"><div><div class="balance-label">SỐ DƯ KHẢ DỤNG</div>' +
      '<div class="balance-value">' + money(user.balance) + '</div></div><div style="text-align:right"><span class="vip-pill">👑 VIP ' + Number(user.vipLevel || 0) + '</span>' +
      '<div style="margin-top:10px"><button class="primary" data-page="wallet">＋ Nạp tiền</button></div></div></div></section>' +
      '<div class="section-head"><h3>Khám phá dịch vụ</h3><span>Chọn tính năng</span></div>' +
      '<section class="service-grid">' + services.map(item =>
        '<button class="service-tile ' + item[4] + '" data-page="' + item[0] + '"><span class="emoji">' + item[1] +
        '</span><span><b>' + item[2] + '</b><small>' + item[3] + '</small></span></button>'
      ).join('') + '</section>' +
      '<div class="section-head"><h3>Trung tâm khách hàng</h3><span>' + Number(state.boot.referralCount || 0) + ' lượt giới thiệu</span></div>' +
      '<button class="card" data-page="customer" style="width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid #e1e9fb"><b style="font-size:13px">💎 Quản lý tài khoản và hỗ trợ</b><span class="price">Mở trung tâm →</span></button>' +
      (state.boot.isAdmin ? '<div class="notice good" style="margin-top:12px">Tài khoản quản trị đã được xác thực. Mục Quản trị chỉ hiển thị với Admin.</div>' : '');
  }

  function renderCatalog(category) {
    const products = (state.boot.products || []).filter(product => product.category === category);
    const title = labels[category] || 'Dịch vụ';
    const tabs = ['minigame','tools','codes','otp','proxy','vip'].map(key =>
      '<button class="tab ' + (key === category ? 'active' : '') + '" data-category="' + key + '">' +
      escapeHtml(labels[key]) + '</button>'
    ).join('');
    return '<div class="tabs">' + tabs + '</div><div class="section-head"><h3>' + escapeHtml(title) + '</h3><span>' + products.length + ' sản phẩm</span></div>' +

      '<p>' + escapeHtml(ticket.message) + '</p><form class="form" data-ticket-form="' + ticket.id + '">' +
      '<div class="field"><label>Phản hồi (sẽ gửi tin nhắn Telegram)</label><textarea name="reply">' + escapeHtml(ticket.admin_reply || '') + '</textarea></div>' +
      '<div class="two-col"><div class="field"><label>Trạng thái</label><select name="status">' + ['open','processing','resolved','closed'].map(s => '<option value="' + s + '" ' + (ticket.status === s ? 'selected' : '') + '>' + statusLabel(s) + '</option>').join('') + '</select></div><button class="tiny-btn" style="align-self:end">Gửi phản hồi</button></div></form></article>'
    ).join('') : empty('Chưa có ticket','Yêu cầu hỗ trợ của khách hàng sẽ được lưu tại đây.');
  }

  function adminSettings() {
    const s = state.adminData.settings || {};
    const field = (key,label,type) => '<div class="field"><label>' + label + '</label><input name="' + key + '" type="' + (type || 'text') + '" value="' + escapeHtml(s[key] || '') + '"></div>';
    return '<form id="admin-settings-form" class="card form"><b>Cấu hình hiển thị và nghiệp vụ</b>' +
      field('homepage_title','Tên thương hiệu') +
      '<div class="field"><label>Thông báo trang chủ</label><textarea name="announcement">' + escapeHtml(s.announcement || '') + '</textarea></div>' +
      field('VIETQR_BANK_ID','Mã ngân hàng VietQR') +
      field('VIETQR_ACCOUNT_NO','Số tài khoản nhận tiền') +
      field('VIETQR_ACCOUNT_NAME','Tên chủ tài khoản') +
      field('GROUP_URL','Liên kết nhóm HTTPS','url') +
      field('CHANNEL_URL','Liên kết kênh HTTPS','url') +
      field('referral_commission_percent','Hoa hồng giới thiệu (%)','number') +
      '<div class="field"><label>Lời nhắn CSKH</label><textarea name="support_message">' + escapeHtml(s.support_message || '') + '</textarea></div>' +
      '<button class="primary">Lưu cấu hình</button></form>' +
      '<div class="notice warn">Các trường trên là cấu hình nghiệp vụ không phải secret. BOT_TOKEN, DATABASE_URL, WEBHOOK_SECRET và API key chỉ thay đổi trong Render Environment, không lưu ở cơ sở dữ liệu ứng dụng.</div>';
  }

  function adminGiftcodes() {
    const codes = state.adminData.giftcodes || [];
    return '<form class="card form" id="admin-gift-form"><b>Tạo Giftcode</b><div class="field"><label>Mã (để trống sẽ tự tạo)</label><input name="code" maxlength="64"></div>' +
      '<div class="two-col"><div class="field"><label>Thưởng VNĐ</label><input name="rewardAmount" type="number" min="0" step="1" value="0" required></div>' +
      '<div class="field"><label>Số lượt tối đa</label><input name="maxRedemptions" type="number" min="1" value="1" required></div></div>' +
      '<div class="field"><label>Hết hạn (không bắt buộc)</label><input name="expiresAt" type="datetime-local"></div><button class="primary">Tạo mã</button></form>' +
      (codes.length ? codes.map(code =>
        '<div class="list-row"><div><b>' + escapeHtml(code.code) + '</b><small>Thưởng ' + money(code.reward_amount) + ' · Đã dùng ' + code.redeemed_count + '/' + code.max_redemptions +
        (code.expires_at ? ' · Hết hạn ' + new Date(code.expires_at).toLocaleString('vi-VN') : '') + '</small></div>' +
        '<div style="text-align:right"><span class="status ' + (code.is_active ? 'completed' : 'cancelled') + '">' + (code.is_active ? 'Hoạt động' : 'Đã khóa') + '</span>' +
        '<div style="margin-top:7px"><button class="tiny-btn" data-toggle-giftcode="' + escapeHtml(code.code) + '" data-active="' + String(Boolean(code.is_active)) + '">' + (code.is_active ? 'Khóa mã' : 'Mở mã') + '</button></div></div></div>'
      ).join('') : empty('Chưa có giftcode','Tạo giftcode và đặt hạn sử dụng trước khi chia sẻ.'));
  }

  function adminUsers() {
    const users = state.adminData.users || [];
    return '<form class="form" id="admin-user-search"><div class="field"><label>Tìm theo Telegram ID, tên hoặc username</label><input name="search" placeholder="Nhập từ khóa"></div><button class="secondary">Tìm thành viên</button></form>' +
      (users.length ? users.map(user =>
        '<article class="record"><div class="record-top"><div><b>' + escapeHtml(user.name || user.username || user.user_id) + '</b><small class="muted">ID ' + escapeHtml(user.user_id) + ' · VIP ' + user.vip_level + '</small></div><b class="price">' + money(user.balance) + '</b></div>' +
        '<form class="form" data-adjust-form="' + escapeHtml(user.user_id) + '"><div class="two-col"><div class="field"><label>Loại</label><select name="direction"><option value="credit">Cộng tiền</option><option value="debit">Trừ tiền</option></select></div><div class="field"><label>Số tiền</label><input name="amount" type="number" min="1" required></div></div><div class="field"><label>Lý do</label><input name="description" maxlength="300"></div><button class="tiny-btn">Xác nhận điều chỉnh</button></form></article>'
      ).join('') : empty('Không có thành viên phù hợp','Tài khoản đã đăng ký sẽ xuất hiện tại đây.'));
  }

  async function renderAdmin() {
    if (!state.boot.isAdmin) throw new Error('Tài khoản này không có quyền quản trị.');
    await adminLoad(state.adminTab);
    let body = '';
    if (state.adminTab === 'overview') body = adminOverview();
    if (state.adminTab === 'products') body = adminProducts();
    if (state.adminTab === 'orders') body = adminOrders();
    if (state.adminTab === 'tickets') body = adminTickets();
    if (state.adminTab === 'settings') body = adminSettings();
    if (state.adminTab === 'giftcodes') body = adminGiftcodes();
    if (state.adminTab === 'users') body = adminUsers();
    return '<div class="notice good">Đã xác thực quyền quản trị cho Telegram ID ' + escapeHtml(state.boot.user.id) + '.</div>' +
      adminTabs() + body;
  }

  async function renderPage() {
    const page = state.page;
    const meta = pageTitles[page] || pageTitles.home;
    header(meta[0],meta[1]);
    $('app').innerHTML = '<div class="loading">Đang tải dữ liệu…</div>';
    try {
      let html = '';
      if (page === 'home') html = renderHome();
      else if (['minigame','tools','codes','otp','proxy'].includes(page)) html = renderCatalog(page);
      else if (page === 'wallet') html = await renderWallet();
      else if (page === 'orders') html = await renderOrders();
      else if (page === 'customer') html = await renderCustomer();
      else if (page === 'support') html = await renderSupport();
      else if (page === 'referrals') html = await renderReferrals();
      else if (page === 'giftcode') html = renderGiftcode();
      else if (page === 'vip') html = await renderVip();
      else if (page === 'matchmaking') html = await renderMatchmaking();
      else if (page === 'admin') html = await renderAdmin();
      else html = renderHome();
      $('app').innerHTML = html;
      if (page === 'wallet') {
        document.querySelectorAll('[data-amount]').forEach(button => button.addEventListener('click',() => showQr(button.dataset.amount)));
      }
    } catch (error) {
      $('app').innerHTML = '<div class="notice warn">' + escapeHtml(error.message) + '</div><button class="secondary" data-page="home">Quay về trang chủ</button>';
    }
  }

  function navigate(page) {
    if (page === 'admin' && (!state.boot || !state.boot.isAdmin)) {
      toast('Bạn không có quyền truy cập khu vực quản trị.');
      return;
    }
    state.page = page;
    if (tg && typeof tg.HapticFeedback !== 'undefined') tg.HapticFeedback.selectionChanged();
    renderPage();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  document.addEventListener('click', async event => {
    const pageButton = event.target.closest('[data-page]');
    if (pageButton) { navigate(pageButton.dataset.page); return; }
    const categoryButton = event.target.closest('[data-category]');
    if (categoryButton) { state.category=categoryButton.dataset.category; navigate(state.category); return; }
    const adminTab = event.target.closest('[data-admin-tab]');
    if (adminTab) {
      state.adminTab=adminTab.dataset.adminTab;
      await renderPage();
      return;
    }
    const joinMatch = event.target.closest('[data-match-join]');
    if (joinMatch) {
      const mode = $('match-mode').value;
      joinMatch.disabled = true;
      try {
        const result = await api('/api/matchmaking/join','POST',{mode});
        toast(result.status === 'matched' ? 'Đã tìm thấy đối thủ.' : 'Đã vào hàng chờ ghép đôi.');
        await renderPage();
      } catch (error) { toast(error.message); joinMatch.disabled = false; }
      return;
    }
    const leaveMatch = event.target.closest('[data-match-leave]');
    if (leaveMatch) {
      try { await api('/api/matchmaking/leave','POST',{}); toast('Đã rời hàng chờ.'); await renderPage(); }
      catch (error) { toast(error.message); }
      return;
    }
    const refreshMatch = event.target.closest('[data-match-refresh]');
    if (refreshMatch) { await renderPage(); return; }
    const finishMatch = event.target.closest('[data-match-finish]');
    if (finishMatch) {
      try {
        await api('/api/matchmaking/finish','POST',{matchId:finishMatch.dataset.matchFinish});
        toast('Đã kết thúc lượt ghép.');
        await renderPage();
      } catch (error) { toast(error.message); }
      return;
    }
    const buy = event.target.closest('[data-buy]');
    if (buy) {
      const product = state.boot.products.find(item => item.id === buy.dataset.buy);
      if (!product) return;
      const confirmed = !tg || !tg.showConfirm ? window.confirm('Mua ' + product.name + ' với giá ' + money(product.price) + '?') :
        await new Promise(resolve => tg.showConfirm('Mua ' + product.name + ' với giá ' + money(product.price) + '?',resolve));
      if (!confirmed) return;
      buy.disabled = true;
      try {
        const result = await api('/api/orders','POST',{productId:product.id});
        state.boot.user.balance = result.order.balance;
        toast('Đã tạo đơn ' + result.order.order_code);
        navigate('orders');
      } catch (error) {
        toast(error.message);
        if (error.message.toLowerCase().includes('số dư')) navigate('wallet');
        buy.disabled = false;
      }
      return;
    }
    const copy = event.target.closest('[data-copy]');
    if (copy) {
      const text = copy.dataset.copy;
      try {
        if (tg && tg.CloudStorage) {
          await navigator.clipboard.writeText(text);
        } else {
          await navigator.clipboard.writeText(text);
        }
        toast('Đã sao chép.');
      } catch (error) { toast('Không thể sao chép trên thiết bị này.'); }
      return;
    }
    const cancelEdit = event.target.closest('[data-cancel-product-edit]');
    if (cancelEdit) {
      state.editingProductId = null;
      await renderPage();
      return;
    }
    const editProduct = event.target.closest('[data-edit-product]');
    if (editProduct) {
      state.editingProductId = editProduct.dataset.editProduct;
      await renderPage();
      window.scrollTo({top:0,behavior:'smooth'});
      return;
    }
    const toggleProduct = event.target.closest('[data-toggle-product]');
    if (toggleProduct) {
      const nextActive = toggleProduct.dataset.active !== 'true';
      const action = nextActive ? 'Mở bán lại sản phẩm này?' : 'Tạm ngừng bán sản phẩm này?';
      if (!window.confirm(action)) return;
      try {
        await api('/api/admin/products/' + toggleProduct.dataset.toggleProduct,'PATCH',{isActive:nextActive});
        state.editingProductId = null;
        toast(nextActive ? 'Đã mở bán sản phẩm.' : 'Đã tạm ngừng bán sản phẩm.');
        await renderPage();
      } catch (error) { toast(error.message); }
      return;
    }
    const toggleGiftcode = event.target.closest('[data-toggle-giftcode]');
    if (toggleGiftcode) {
      const nextActive = toggleGiftcode.dataset.active !== 'true';
      if (!window.confirm(nextActive ? 'Mở lại giftcode này?' : 'Khóa giftcode này?')) return;
      try {
        await api('/api/admin/giftcodes/' + encodeURIComponent(toggleGiftcode.dataset.toggleGiftcode),'PATCH',{isActive:nextActive});
        toast(nextActive ? 'Đã mở giftcode.' : 'Đã khóa giftcode.');
        await renderPage();
      } catch (error) { toast(error.message); }
      return;
    }
  });

  document.addEventListener('submit', async event => {
    const form = event.target;
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      if (form.id === 'custom-topup') {
        const amount = Number(data.amount);
        if (!Number.isSafeInteger(amount) || amount < 10000) throw new Error('Số tiền tối thiểu là 10.000 VNĐ.');
        await showQr(amount);
      } else if (form.id === 'support-form') {
        await api('/api/support/tickets','POST',data);
        toast('Đã gửi yêu cầu hỗ trợ.');
        await renderPage();
      } else if (form.id === 'giftcode-form') {
        const result = await api('/api/giftcodes/redeem','POST',data);
        toast(result.message + ' +' + money(result.reward));
        await renderPage();
      } else if (form.id === 'admin-product-form') {
        data.price = Number(data.price);
        data.durationDays = Number(data.durationDays || 0);
        data.vipLevel = Number(data.vipLevel || 0);
        if (data.stock === '') data.stock = null; else if (data.stock !== null) data.stock = Number(data.stock);
        const productId = form.dataset.productId;
        if (productId) {
          await api('/api/admin/products/' + productId,'PATCH',data);
          toast('Đã cập nhật sản phẩm.');
        } else {
          await api('/api/admin/products','POST',data);
          toast('Đã tạo sản phẩm.');
        }
        state.editingProductId = null;
        await renderPage();
      } else if (form.id === 'admin-settings-form') {
        delete data.undefined;
        await api('/api/admin/settings','PATCH',data);
        toast('Đã lưu cấu hình.');
        await renderPage();
      } else if (form.id === 'admin-gift-form') {
        data.rewardAmount = Number(data.rewardAmount);
        data.maxRedemptions = Number(data.maxRedemptions);
        if (!data.expiresAt) delete data.expiresAt;
        else data.expiresAt = new Date(data.expiresAt).toISOString();
        const result = await api('/api/admin/giftcodes','POST',data);
        toast('Đã tạo giftcode ' + result.giftcode.code);
        await renderPage();
      } else if (form.id === 'admin-user-search') {
        state.adminData.users = (await api('/api/admin/users?search=' + encodeURIComponent(data.search || ''))).users;
        $('app').innerHTML = adminTabs() + adminUsers();
      } else if (form.dataset.orderForm) {
        await api('/api/admin/orders/' + form.dataset.orderForm,'PATCH',data);
        toast('Đã cập nhật đơn hàng và gửi thông báo.');
        await renderPage();
      } else if (form.dataset.ticketForm) {
        await api('/api/admin/tickets/' + form.dataset.ticketForm,'PATCH',data);
        toast('Đã cập nhật ticket CSKH.');
        await renderPage();
      } else if (form.dataset.adjustForm) {
        data.amount = Number(data.amount);
        await api('/api/admin/users/' + form.dataset.adjustForm + '/adjust-balance','POST',data);
        toast('Đã điều chỉnh số dư.');
        await renderPage();
      }
    } catch (error) { toast(error.message); }
  });

  $('menu-button').addEventListener('click',()=>{
    if (tg && tg.showPopup) {
      tg.showPopup({
        title:'Menu Hendy Bot',
        buttons:[
          {id:'home',type:'default',text:'Trang chủ'},
          {id:'wallet',type:'default',text:'Ví điện tử'},
          {id:'orders',type:'default',text:'Đơn hàng'}
        ]
      }, id=>{if(id) navigate(id);});
    } else {
      navigate(state.boot && state.boot.isAdmin ? 'admin' : 'customer');
    }
  });

  async function start() {
    if (!initData) {
      $('page-title').textContent='Mở Hendy Bot trong Telegram';
      $('page-subtitle').textContent='Ứng dụng cần dữ liệu xác thực Telegram để bảo vệ tài khoản.';
      $('app').innerHTML='<div class="hero"><h2>Hendy Bot</h2><p>Hãy mở Mini App bằng nút chức năng trong cuộc trò chuyện với bot. Không đăng nhập bằng Telegram ID nhập tay.</p></div><div class="notice warn">Không thể xác thực trình duyệt bên ngoài Telegram.</div>';
      $('profile-name').textContent='Chưa đăng nhập';
      return;
    }
    try {
      state.boot = await api('/api/bootstrap');
      $('profile-name').textContent = state.boot.user.name || 'Thành viên';
      $('brand-name').textContent = state.boot.settings.homepage_title || 'Hendy Bot';
      $('profile-chip').querySelector('.avatar').textContent = (state.boot.user.name || 'H').slice(0,1).toUpperCase();
      const requested = new URLSearchParams(location.search).get('section');
      const valid = ['home','minigame','tools','codes','otp','proxy','vip','wallet','orders','customer','support','referrals','giftcode','matchmaking','admin'];
      state.page = valid.includes(requested) ? requested : 'home';
      if (state.page === 'admin' && !state.boot.isAdmin) state.page = 'home';
      renderPage();
    } catch (error) {
      $('page-title').textContent='Không thể xác thực';
      $('page-subtitle').textContent='Vui lòng mở lại Mini App từ Telegram Bot.';
      $('app').innerHTML='<div class="notice warn">' + escapeHtml(error.message) + '</div>';
    }
  }
  start();
})();
</script>
</body>
</html>
