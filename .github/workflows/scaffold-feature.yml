name: Scaffold feature branch

on:
  workflow_dispatch:
    inputs:
      feature_name:
        description: "Tên feature dạng kebab-case (ví dụ order-history)"
        required: true
        type: string
      category:
        description: "Nơi tạo scaffold"
        required: true
        type: choice
        options:
          - api
          - bot
          - dashboard
      description:
        description: "Mô tả mục tiêu feature"
        required: false
        type: string
        default: "Scaffold generated by GitHub Actions"

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate feature files
        run: |
          node scripts/scaffold-feature.js \
            --name "\${{ inputs.feature_name }}" \
            --category "\${{ inputs.category }}" \
            --description "\${{ inputs.description }}"
      - name: Create review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          branch: scaffold/\${{ inputs.feature_name }}
          delete-branch: true
          commit-message: "chore(scaffold): add \${{ inputs.feature_name }} feature"
          title: "Scaffold feature: \${{ inputs.feature_name }}"
          body: |
            Tự động tạo scaffold cho feature \${{ inputs.feature_name }}.
            Loại: \${{ inputs.category }}
            Mô tả: \${{ inputs.description }}

            Tệp mới ở trạng thái disabled. Review phân quyền, API, migration và test trước khi bật.
